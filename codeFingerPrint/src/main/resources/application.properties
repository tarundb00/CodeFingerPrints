
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codeFingerPrint?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR-PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Apply idempotent SQL bootstrap scripts for databases created before new entities were added.
spring.sql.init.mode=always

server.port=8080

jwt.secret=${JWT_SECRET:codefingerprint-super-secret-key-change-this-in-production-min-256-bits}
jwt.legacy-secret=${JWT_LEGACY_SECRET:codefingerprint-local-development-secret-change-me}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:YOUR-EMAIL}
spring.mail.password=${MAIL_PASSWORD:GENERATED-PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.web.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Python contributions analyzer service
python.analyzer.url=${PYTHON_ANALYZER_URL:http://localhost:9000}
